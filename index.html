<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKY DICE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>EKY DICE</h1>

    <div class="section">
      <div class="title">SELECT NUMBER</div>

      <div class="numbers">
        <button class="number active" data-number="1">1</button>
        <button class="number" data-number="2">2</button>
        <button class="number" data-number="3">3</button>
        <button class="number" data-number="4">4</button>
        <button class="number" data-number="5">5</button>
        <button class="number" data-number="6">6</button>
      </div>
    </div>

    <div class="dice-area">
      <div id="diceCircle" class="dice-circle"></div>
    </div>

    <button id="rollButton" class="roll-button">ROLL</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
